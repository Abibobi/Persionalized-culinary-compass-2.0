version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pcc_postgres
    restart: always
    environment:
      POSTGRES_DB: pcc_db
      POSTGRES_USER: pcc_user
      POSTGRES_PASSWORD: pcc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pcc_redis
    restart: always
    ports:
      - "6379:6379"

  # Optional: pgAdmin for database management (Uncomment to use)
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pcc_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@pcc.com
  #     PGADMIN_DEFAULT_PASSWORD: admin_password
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db

volumes:
  postgres_data: